# Đặt file này tại: .github/workflows/snake.yml
# trong repo khangksp/khangksp

name: Generate Snake Animation

on:
  schedule:
    # Chạy lại mỗi 12 tiếng để cập nhật contribution mới
    - cron: "0 */12 * * *"
  workflow_dispatch:   # cho phép bấm chạy tay
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate snake.svg
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: khangksp
          outputs: |
            dist/snake.svg?palette=github-dark
            dist/snake-light.svg?palette=github-light

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
